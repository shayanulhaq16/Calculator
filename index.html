<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - by Syan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="container1">
            <div class="name-1">
                Syan
            </div>
            <div class="name-2">
                <div class="charging"></div>
                <div class="model">30110</div>
            </div>
        </div>
        <div class="container2"></div>
        <div class="container3">
            <div class="btn firstline" onclick="calculator('root')">√</div>
            <div class="btn firstline" onclick="calculator('ntop')">+/−</div>
            <div class="btn firstline" onclick="calculator('backspace')">▶</div>
            <div class="btn onac firstline" onclick="calculator('on')">ON/AC</div>
            <div class="btn firstline" onclick="calculator('ce')">CE/C</div>
            <div class="btn" onclick="calculator('grandtotal')">GT</div>
            <div class="btn" onclick="calculator('markup')">MU</div>
            <div class="btn" onclick="calculator('percent')">%</div>
            <div class="btn" onclick="calculator('divide')">÷</div>
            <div class="btn" onclick="calculator('memoryclear')">MC</div>
            <div class="btn number" onclick="calculator(7)">7</div>
            <div class="btn number" onclick="calculator(8)">8</div>
            <div class="btn number" onclick="calculator(9)">9</div>
            <div class="btn" onclick="calculator('multy')">x</div>
            <div class="btn" onclick="calculator('memoryrcall')">MR</div>
            <div class="btn number" onclick="calculator(4)">4</div>
            <div class="btn number" onclick="calculator(5)">5</div>
            <div class="btn number" onclick="calculator(6)">6</div>
            <div class="btn" onclick="calculator('minus')">-</div>
            <div class="btn" onclick="calculator('minusfrommemory')">M-</div>
            <div class="btn number" onclick="calculator(1)">1</div>
            <div class="btn number" onclick="calculator(2)">2</div>
            <div class="btn number" onclick="calculator(3)">3</div>
            <div class="btn" onclick="calculator('plus')">+</div>
            <div class="btn" onclick="calculator('plusfrommemory')">M+</div>
            <div class="btn number" onclick="calculator(0)">0</div>
            <div class="btn number" onclick="calculator('dzero')">00</div>
            <div class="btn point" onclick="calculator('point')">.</div>
            <div class="btn equals" onclick="output('equals')">=</div>
        </div>
    </div>
</body>
</html>
