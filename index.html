<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - by Syan</title>
    <link rel="icon" type="image/x-icon" href="images/titlelogo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="container1">
            <div class="name-1">
                Syan
            </div>
            <div class="name-2">
                <div class="charging"></div>
                <div class="model">30110</div>
            </div>
        </div>
        <div class="container2"></div>
        <div class="container3">
            <div class="line">
                
                <button class="btn firstline" onclick="calculator('root')">√</button>
                <button class="btn firstline" onclick="calculator('ntop')">+/−</button>
                <button class="btn firstline" onclick="calculator('backspace')">▶</button>
                <button class="btn onac firstline" onclick="calculator('on')">ON/</button>
                <button class="btn firstline" onclick="calculator('ce')">CE/</button>
            </div>
            <div class="line">
                
                <button class="btn" onclick="calculator('grandtotal')">GT</button>
                <button class="btn" onclick="calculator('markup')">MU</button>
                <button class="btn" onclick="calculator('percent')">%</button>
                <button class="btn" onclick="calculator('divide')">÷</button>
                <button class="btn" onclick="calculator('memoryclear')">MC</button>
            </div>
            <div class="line">
                
                <button class="btn number" onclick="calculator(7)">7</button>
                <button class="btn number" onclick="calculator(8)">8</button>
                <button class="btn number" onclick="calculator(9)">9</button>
                <button class="btn" onclick="calculator('multy')">x</button>
                <button class="btn" onclick="calculator('memoryrcall')">MR</button>
            </div>
            <div class="line">

                <button class="btn number" onclick="calculator(4)">4</button>
                <button class="btn number" onclick="calculator(5)">5</button>
                <button class="btn number" onclick="calculator(6)">6</button>
                <button class="btn" onclick="calculator('minus')">-</button>
                <button class="btn" onclick="calculator('minusfrommemory')">M-</button>
            </div>
            <div class="line">

                <button class="btn number" onclick="calculator(1)">1</button>
                <button class="btn number" onclick="calculator(2)">2</button>
                <button class="btn number" onclick="calculator(3)">3</button>
                <button class="btn" onclick="calculator('plus')">+</button>
                <button class="btn" onclick="calculator('plusfrommemory')">M+</button>
            </div>
            <div class="line">

                <button class="btn number" onclick="calculator(0)">0</button>
                <button class="btn number" onclick="calculator('dzero')">00</button>
                <button class="btn point" onclick="calculator('point')">.</button>
                <button class="btn equals" onclick="output('equals')">=</button>
            </div>
        </div>
    </div>
</body>
</html>
